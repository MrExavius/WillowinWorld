          - heading "Quick answers for players, press and publishers." [level=2] [ref=e348]
          - generic [ref=e349]:
            - article [ref=e350]:
              - button "What kind of games does WillowinWorlds make?" [ref=e351] [cursor=pointer]
              - paragraph [ref=e353]: We make mobile-first puzzle and arcade games with tactile systems, cozy fantasy identity, physics-driven moments, polished UI and characters that feel alive.
            - article [ref=e354]:
              - button "Can I disable animations?" [ref=e355] [cursor=pointer]
              - paragraph [ref=e357]: Yes. The site respects reduced motion and Save-Data settings, lowers effects for slower connections and pauses its scene when the tab is hidden.
            - article [ref=e358]:
              - button "Does the site follow my day or night theme?" [ref=e359] [cursor=pointer]
              - paragraph [ref=e361]: Yes. On a first visit it uses the saved theme if one exists, then the system color preference, then local time. If none of those can be read, WillowinWorlds starts in dark mode.
            - article [ref=e362]:
              - button "Do you work with publishers?" [ref=e363] [cursor=pointer]
              - paragraph [ref=e365]: Yes. We are open to focused publisher conversations around production, platform strategy, UA, live operations and long-term game growth. The press kit has the cleanest facts and asset links.
            - article [ref=e366]:
              - button "Are your games mobile-first?" [ref=e367] [cursor=pointer]
              - paragraph [ref=e369]: Yes. We design around mobile input, session length, screen clarity and performance from the first prototype.
            - article [ref=e370]:
              - button "Can I send a portfolio?" [ref=e371] [cursor=pointer]
              - paragraph [ref=e373]: Yes. Artists, Unity developers, designers, animators and audio collaborators can contact us at contact@willowinworld.com with a focused portfolio link and role context.
            - article [ref=e374]:
              - button "Can I collaborate with the studio?" [ref=e375] [cursor=pointer]
              - paragraph [ref=e377]: "We are open to focused collaborations that match the studio tone: premium, tactile, magical and production-minded."
