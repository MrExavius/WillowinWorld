      - generic [ref=f6e210]:
        - generic [ref=f6e211]:
          - heading "Одно действие. Целый живой мир." [level=2] [ref=f6e213]
          - paragraph [ref=f6e214]: Каждая игра начинается с одного жеста — нарисовать, бросить, смешать или уклониться, — а затем раскрывается через характер, ясную обратную связь и понятные без инструкции последствия.
        - generic [ref=f6e215]:
          - article [ref=f6e216]:
            - heading "Живое взаимодействие" [level=3] [ref=f6e220]
            - paragraph [ref=f6e221]: Каждое касание, линия, падение и выстрел вызывает немедленный визуальный отклик, поэтому причина и следствие остаются ясными.
          - article [ref=f6e222]:
            - heading "Читабельный дизайн" [level=3] [ref=f6e226]
            - paragraph [ref=f6e227]: Движение, контраст и темп показывают цель и последствия до того, как потребуется пояснительный текст.
          - article [ref=f6e228]:
            - heading "Личность персонажа" [level=3] [ref=f6e232]
            - paragraph [ref=f6e233]: Талисманы, объекты и пользовательский интерфейс приобретают индивидуальность еще до того, как приобретают украшения.
          - article [ref=f6e234]:
            - heading "Мобильный UX с первого дня" [level=3] [ref=f6e238]
            - paragraph [ref=f6e239]: Элементы управления, ритм и макет созданы для больших пальцев, коротких сеансов, читаемого пользовательского интерфейса и четких решений на маленьких экранах.
          - article [ref=f6e240]:
            - heading "Выразительная обратная связь" [level=3] [ref=f6e244]
            - paragraph [ref=f6e245]: Моменты удара, слияния, всплеска, победы и неудачи настраиваются до тех пор, пока они не станут четкими.
          - article [ref=f6e246]:
            - heading "Уют с глубиной" [level=3] [ref=f6e250]
            - paragraph [ref=f6e251]: Мягкая презентация оставляет место для планирования, освоения и повторения.
      - generic [ref=f6e253]:
        - article [ref=f6e254]:
          - heading "Небольшая студия живых мобильных миров." [level=2] [ref=f6e255]
          - paragraph [ref=f6e256]: "WillowinWorlds разрабатывает четыре мобильные головоломки и аркадные игры: Nature Seed, Candy Shop, Paint Blasters и Ball is God?!. Каждый проект имеет общедоступную страницу игры, текущий статус сборки, датированный журнал разработки и материалы для прессы."
          - generic [ref=f6e257]:
            - generic [ref=f6e258]: Мобильный подход
            - generic [ref=f6e259]: Уютные фэнтезийные миры
            - generic [ref=f6e260]: Интерактивные системы
            - generic [ref=f6e261]: Отличительная 2D-графика
          - paragraph [ref=f6e262]: Текущая работа включает в себя физику рисования линий, объединение конфет в десяти контейнерах, 35 рецептов цветных снарядов и спуск с помощью вращающейся башни в десяти локациях.
        - article [ref=f6e263]:
          - img "Логотип WillowinWorlds с волшебным котом, двойным знаком W и миром замков." [ref=f6e265]
          - generic [ref=f6e266]:
            - heading "Четыре игры. Четыре различные игровые системы." [level=3] [ref=f6e267]
            - paragraph [ref=f6e268]: Нарисуйте ограниченный физический путь, управляйте меняющимся контейнером для конфет, соберите цветной снимок или вращайте нисходящую башню. Откройте каждую страницу игры, чтобы узнать ее текущий объем, статус производства и последнее датированное обновление.
      - generic [ref=f6e270]:
        - heading "От первой идеи до отполированного мобильного релиза." [level=2] [ref=f6e273]
        - generic [ref=f6e274]:
          - article [ref=f6e275]:
            - text: "01"
            - heading "Идея" [level=3] [ref=f6e276]
            - paragraph [ref=f6e277]: Определите фэнтези, четкий жанр, обещание игрока и основной тактильный цикл.
          - article [ref=f6e278]:
            - text: "02"
            - heading "Прототип" [level=3] [ref=f6e279]
            - paragraph [ref=f6e280]: Создайте кратчайшее игровое доказательство с реальными входными данными, отзывами и состояниями ошибок.
          - article [ref=f6e281]:
            - text: "03"
            - heading "Проверка ощущений" [level=3] [ref=f6e282]
            - paragraph [ref=f6e283]: Настройте элементы управления, трение, темп, читаемость и то, будет ли цикл по-прежнему приятным после повторения.
          - article [ref=f6e284]:
            - text: "04"
            - heading "Художественное направление" [level=3] [ref=f6e285]
            - paragraph [ref=f6e286]: Силуэты форм, палитра, язык пользовательского интерфейса, читаемость значков и идентичность персонажей.
          - article [ref=f6e287]:
            - text: "05"
            - heading "Производство" [level=3] [ref=f6e288]
            - paragraph [ref=f6e289]: Масштабируйте контент, системы, развитие, оптимизацию и технические основы.
          - article [ref=f6e290]:
            - text: "06"
            - heading "Полировка" [level=3] [ref=f6e291]
            - paragraph [ref=f6e292]: Уточните переходы, VFX, звуковые эффекты, адаптацию, доступность и комфорт пользователя.
          - article [ref=f6e293]:
            - text: "07"
            - heading "Запуск" [level=3] [ref=f6e294]
            - paragraph [ref=f6e295]: Подготовьте материалы для магазина, материалы для прессы, аналитику, текущие обновления и циклы сообщества.
          - article [ref=f6e296]:
            - text: "08"
            - heading "Поддержка после релиза" [level=3] [ref=f6e297]
            - paragraph [ref=f6e298]: Измеряйте выпуск, слушайте игроков и следите за здоровьем каждого мира с помощью целенаправленных обновлений.
      - generic [ref=f6e300]:
