      - generic [ref=f7e210]:
        - generic [ref=f7e211]:
          - heading "Isang aksyon. Isang buhay na mundo." [level=2] [ref=f7e213]
          - paragraph [ref=f7e214]: Nagsisimula ang bawat laro sa isang panuntunan sa pagpindot—pag-draw, drop, mix o dodge—pagkatapos ay nagdaragdag ng karakter, malinaw na feedback at mga kahihinatnan na mababasa ng mga manlalaro nang walang manual.
        - generic [ref=f7e215]:
          - article [ref=f7e216]:
            - heading "Mapaglarong Pakikipag-ugnayan" [level=3] [ref=f7e220]
            - paragraph [ref=f7e221]: Bawat tap, linya, drop at shot ay nakakakuha ng agarang visual na tugon, kaya ang sanhi at epekto ay manatiling malinaw.
          - article [ref=f7e222]:
            - heading "Nababasang Disenyo" [level=3] [ref=f7e226]
            - paragraph [ref=f7e227]: Ang paggalaw, contrast at pacing ay nagpapakita ng layunin at kahihinatnan bago kailangan ang tekstong paliwanag.
          - article [ref=f7e228]:
            - heading "Pagkakakilanlan ng Tauhan" [level=3] [ref=f7e232]
            - paragraph [ref=f7e233]: Ang mga maskot, bagay at UI ay may personalidad bago sila magkaroon ng dekorasyon.
          - article [ref=f7e234]:
            - heading "Mobile-first UX" [level=3] [ref=f7e238]
            - paragraph [ref=f7e239]: Ang mga kontrol, ritmo at layout ay binuo para sa mga thumbs, maiikling session, nababasang UI at malinaw na mga desisyon sa maliliit na screen.
          - article [ref=f7e240]:
            - heading "Kasiya-siyang Feedback" [level=3] [ref=f7e244]
            - paragraph [ref=f7e245]: Pinapakinis ang bawat bagsak, merge, tilamsik, tagumpay, at pagkatalo hanggang maging malinaw at kasiya-siya ang pakiramdam.
          - article [ref=f7e246]:
            - heading "Maginhawang Lalim" [level=3] [ref=f7e250]
            - paragraph [ref=f7e251]: Ang malambot na pagtatanghal ay nag-iiwan ng puwang para sa pagpaplano, pagkabisado at pag-replay.
      - generic [ref=f7e253]:
        - article [ref=f7e254]:
          - heading "Isang maliit na studio para sa mga tactile mobile na mundo." [level=2] [ref=f7e255]
          - paragraph [ref=f7e256]: "Ang WillowinWorlds ay bubuo ng apat na mobile-first puzzle at arcade game: Nature Seed, Candy Shop, Paint Blasters at Ball is God?! Ang bawat proyekto ay may pampublikong pahina ng asset ng laro, kasalukuyang status ng build, may petsang devlog at press."
          - generic [ref=f7e257]:
            - generic [ref=f7e258]: Mobile-first feel
            - generic [ref=f7e259]: Mga maaliwalas na mundo ng pantasya
            - generic [ref=f7e260]: Mga interactive na system
            - generic [ref=f7e261]: Natatanging 2D art
          - paragraph [ref=f7e262]: Saklaw ng kasalukuyang trabaho ang line physics na draw-to-solve, pagsasanib ng kendi sa sampung lalagyan, 35 recipe ng projectile na may kulay, at pagbaba sa umiikot na tore sa sampung lokasyon.
        - article [ref=f7e263]:
          - img "Logo ng WillowinWorlds na may mahiwagang pusa, kambal na markang W, at mundong may kastilyo" [ref=f7e265]
          - generic [ref=f7e266]:
            - heading "Apat na laro. Apat na natatanging puwedeng laruin na sistema." [level=3] [ref=f7e267]
            - paragraph [ref=f7e268]: Gumuhit ng limitadong pisikal na landas, pamahalaan ang isang nagbabagong lalagyan ng kendi, mag-assemble ng color shot o paikutin ang pababang tore. Buksan ang bawat page ng laro para sa kasalukuyang saklaw nito, katayuan ng produksyon at pinakabagong napetsahan na update.
      - generic [ref=f7e270]:
        - heading "Mula sa unang kawit sa pinakintab na paglabas ng mobile." [level=2] [ref=f7e273]
        - generic [ref=f7e274]:
          - article [ref=f7e275]:
            - text: "01"
            - heading "Ideya" [level=3] [ref=f7e276]
            - paragraph [ref=f7e277]: Tukuyin ang pantasya, malinaw na genre, pangako ng manlalaro at pangunahing tactile loop.
          - article [ref=f7e278]:
            - text: "02"
            - heading "Prototipo" [level=3] [ref=f7e279]
            - paragraph [ref=f7e280]: Buuin ang pinakamaikling puwedeng laruin na patunay na may totoong input, feedback at mga estado ng pagkabigo.
          - article [ref=f7e281]:
            - text: "03"
            - heading "Pagsubok sa Pakiramdam" [level=3] [ref=f7e282]
            - paragraph [ref=f7e283]: Ayusin ang kontrol, friction, pacing, at linaw, at tiyaking masarap pa ring ulitin ang gameplay loop.
          - article [ref=f7e284]:
            - text: "04"
            - heading "Direksyon ng Sining" [level=3] [ref=f7e285]
            - paragraph [ref=f7e286]: Hubugin ang mga silweta, palette, wika ng UI, linaw ng mga icon, at pagkakakilanlan ng karakter.
          - article [ref=f7e287]:
            - text: "05"
            - heading "Produksyon" [level=3] [ref=f7e288]
            - paragraph [ref=f7e289]: I-scale ang content, system, progression, optimization at teknikal na pundasyon.
          - article [ref=f7e290]:
            - text: "06"
            - heading "Pagpapakinis" [level=3] [ref=f7e291]
            - paragraph [ref=f7e292]: Pinuhin ang mga transition, VFX, kumpas ng audio, onboarding, accessibility, at ginhawa ng user.
          - article [ref=f7e293]:
            - text: "07"
            - heading "Ilunsad" [level=3] [ref=f7e294]
            - paragraph [ref=f7e295]: Ihanda ang mga asset ng store, materyales para sa press, analytics, agarang update, at mga gawaing pangkomunidad.
          - article [ref=f7e296]:
            - text: "08"
            - heading "Patuloy na suporta" [level=3] [ref=f7e297]
            - paragraph [ref=f7e298]: Sukatin ang paglabas, makinig sa mga manlalaro at panatilihing malusog ang bawat mundo sa mga nakatutok na update.
