            - generic [ref=f1e289]: Vom ersten Haken
            - generic [ref=f1e290]: zur ausgefeilten mobilen Veröffentlichung.
          - generic [ref=f1e291]:
            - article [ref=f1e292]:
              - text: "01"
              - heading "Idee" [level=3] [ref=f1e293]
              - paragraph [ref=f1e294]: Definieren Sie die Fantasie, das klare Genre, das Versprechen des Spielers und den Kern der taktilen Schleife.
            - article [ref=f1e295]:
              - text: "02"
              - heading "Prototyp" [level=3] [ref=f1e296]
              - paragraph [ref=f1e297]: Erstellen Sie den kürzesten spielbaren Beweis mit echten Eingaben, Rückmeldungen und Fehlerzuständen.
            - article [ref=f1e298]:
              - text: "03"
              - heading "Gefühlstest" [level=3] [ref=f1e299]
              - paragraph [ref=f1e300]: Optimieren Sie die Steuerung, die Reibung, das Tempo, die Lesbarkeit und ob sich die Schleife nach der Wiederholung immer noch gut anfühlt.
            - article [ref=f1e301]:
              - text: "04"
              - heading "Art Direction" [level=3] [ref=f1e302]
              - paragraph [ref=f1e303]: Formsilhouetten, Palette, UI-Sprache, Lesbarkeit von Symbolen und Charakteridentität.
            - article [ref=f1e304]:
              - text: "05"
              - heading "Produktion" [level=3] [ref=f1e305]
              - paragraph [ref=f1e306]: Skalieren Sie Inhalte, Systeme, Fortschritt, Optimierung und technische Grundlagen.
            - article [ref=f1e307]:
              - text: "06"
              - heading "Polnisch" [level=3] [ref=f1e308]
              - paragraph [ref=f1e309]: Verfeinern Sie Übergänge, VFX, Audio-Beats, Onboarding, Zugänglichkeit und Benutzerkomfort.
            - article [ref=f1e310]:
              - text: "07"
              - heading "Starten" [level=3] [ref=f1e311]
              - paragraph [ref=f1e312]: Bereiten Sie Shop-Assets, Pressematerialien, Analysen, Live-Updates und Community-Loops vor.
            - article [ref=f1e313]:
              - text: "08"
              - heading "Live-Pflege" [level=3] [ref=f1e314]
              - paragraph [ref=f1e315]: Messen Sie die Veröffentlichung, hören Sie den Spielern zu und halten Sie jede Welt mit gezielten Updates gesund.
