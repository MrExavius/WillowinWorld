          - generic [ref=f1e223]:
            - heading "Eine Aktion. Eine lebendige Welt." [level=2] [ref=f1e225]
            - paragraph [ref=f1e226]: Jedes Spiel beginnt mit einer One-Touch-Regel – Zeichnen, Ablegen, Mischen oder Ausweichen – und fügt dann Charakter, klares Feedback und Konsequenzen hinzu, die Spieler ohne Handbuch lesen können.
          - generic [ref=f1e227]:
            - article [ref=f1e228]:
              - heading "Spielerische Interaktion" [level=3] [ref=f1e232]
              - paragraph [ref=f1e233]: Auf jedes Tippen, jede Linie, jedes Tropfen und jeden Schuss wird sofort eine visuelle Reaktion ausgelöst, sodass Ursache und Wirkung klar bleiben.
            - article [ref=f1e234]:
              - heading "Lesbares Design" [level=3] [ref=f1e238]
              - paragraph [ref=f1e239]: Bewegung, Kontrast und Tempo zeigen das Ziel und die Konsequenz, bevor es eines erklärenden Textes bedarf.
            - article [ref=f1e240]:
              - heading "Charakteridentität" [level=3] [ref=f1e244]
              - paragraph [ref=f1e245]: Maskottchen, Objekte und Benutzeroberfläche haben Persönlichkeit, bevor sie Dekoration haben.
            - article [ref=f1e246]:
              - heading "Mobile-first UX" [level=3] [ref=f1e250]
              - paragraph [ref=f1e251]: Steuerung, Rhythmus und Layout sind für Daumen, kurze Sitzungen, lesbare Benutzeroberfläche und klare Entscheidungen auf kleinen Bildschirmen ausgelegt.
            - article [ref=f1e252]:
              - heading "Befriedigendes Feedback" [level=3] [ref=f1e256]
              - paragraph [ref=f1e257]: Impact-, Merge-, Splash-, Win- und Fail-Momente werden abgestimmt, bis sie sich knackig anfühlen.
            - article [ref=f1e258]:
              - heading "Gemütliche Tiefe" [level=3] [ref=f1e262]
              - paragraph [ref=f1e263]: Die sanfte Präsentation lässt Raum für Planung, Beherrschung und Wiederholung.
        - button [ref=f1e264] [cursor=pointer]: t
      - generic [ref=f1e265]:
        - generic [ref=f1e266]:
          - article [ref=f1e267]:
            - heading "Ein kleines Studio für taktile mobile Welten." [level=2] [ref=f1e268]
            - paragraph [ref=f1e269]: "WillowinWorld entwickelt vier Mobile-First-Puzzle- und Arcade-Spiele: Nature Seed, Candy Shop, Paint Blasters und Ball is God?!. Jedes Projekt verfügt über eine öffentliche Spieleseite, den aktuellen Build-Status, ein datiertes Devlog und Presseressourcen."
            - generic [ref=f1e270]:
              - generic [ref=f1e271]: Mobile-First-Feeling
              - generic [ref=f1e272]: Gemütliche Fantasiewelten
              - generic [ref=f1e273]: Interaktive Systeme
              - generic [ref=f1e274]: Einzigartige 2D-Kunst
            - paragraph [ref=f1e275]: Die aktuelle Arbeit umfasst das Ziehen und Lösen von Linien, das Verschmelzen von Süßigkeiten in zehn Behältern, 35 Farbprojektilrezepte und einen Abstieg mit rotierenden Türmen an zehn Standorten.
          - article [ref=f1e276]:
            - img "WillowinWorld-Logo mit der magischen Katze, dem Zwillings-W-Zeichen und der Burgwelt" [ref=f1e278]
            - generic [ref=f1e279]:
              - heading "Vier Spiele. Vier verschiedene spielbare Systeme." [level=3] [ref=f1e280]
              - paragraph [ref=f1e281]: Zeichnen Sie einen begrenzten physischen Weg, verwalten Sie einen wechselnden Süßigkeitenbehälter, stellen Sie eine Farbaufnahme zusammen oder drehen Sie einen absteigenden Turm. Öffnen Sie jede Spielseite, um den aktuellen Umfang, den Produktionsstatus und das neueste Update zu erfahren.
        - button [ref=f1e282] [cursor=pointer]: "n"
        - button [ref=f1e283] [cursor=pointer]: B
      - generic [ref=f1e284]:
        - generic [ref=f1e285]:
