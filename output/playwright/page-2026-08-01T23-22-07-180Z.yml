      - generic [ref=f5e112]:
        - generic [ref=f5e113]: ゲーム概要
        - heading "ソフトな物理学とあと 1 ドロップの決定を中心に構築された、居心地の良いモバイル マージ パズル。" [level=2] [ref=f5e114]
        - generic [ref=f5e115]:
          - article [ref=f5e116]:
            - heading "選手の約束" [level=3] [ref=f5e117]
            - paragraph [ref=f5e118]: お菓子を落としたり、大きなおやつを作ったり、すべての実行をソフトな物理現象、甘い驚き、そして満足のいくマージの陽気な連鎖に変えましょう。
          - article [ref=f5e119]:
            - heading "現在のビルド" [level=3] [ref=f5e120]
            - paragraph [ref=f5e121]: 10 個のコンテナ ルールセット、完全な 13 個のキャンディ チェーン、8 個の特殊効果、着陸プレビュー、ホールド、次の 3 つのキューが実装されています。
          - article [ref=f5e122]:
            - heading "観客" [level=3] [ref=f5e123]
            - paragraph [ref=f5e124]: ドロップアンドマージ ゲーム、居心地の良いキャンディーのビジュアル、低プレッシャーな戦略、素早いモバイル セッションを楽しむカジュアルなパズル プレーヤー。
          - article [ref=f5e125]:
            - heading "ステータス" [level=3] [ref=f5e126]
            - paragraph [ref=f5e127]: 積極的な開発。現在の作業は、モバイルのパフォーマンス、UI の洗練、キャンディーのバランス、コンテナーの圧力、読みやすいコンボ フィードバックに重点を置いています。
      - generic [ref=f5e128]:
        - generic [ref=f5e129]: 特徴
        - heading "Candy Shop でプレイヤーが行うこと。" [level=2] [ref=f5e130]
        - generic [ref=f5e131]:
          - article [ref=f5e132]:
            - heading "ドロップアンドマージキャンディープレイ" [level=3] [ref=f5e133]
            - paragraph [ref=f5e134]: プレイヤーはお菓子を容器に入れ、重力とタイミングを利用して、一致するキャンディーを合体させて大きなお菓子にします。
          - article [ref=f5e135]:
            - heading "13段キャンディーチェーン" [level=3] [ref=f5e136]
            - paragraph [ref=f5e137]: マージラダーは、小さなお菓子から画面上の存在感が強い大きな報酬まで、すべてのランに目に見えるゴールを与えます。
          - article [ref=f5e138]:
            - heading "コンボとスペシャルスイーツ" [level=3] [ref=f5e139]
            - paragraph [ref=f5e140]: 実装された 8 つの特別なキャンディー効果は、ペアのレシピと副作用を形成し、繰り返しのセッションにより戦術的なテクスチャーを与えます。
          - article [ref=f5e141]:
            - heading "居心地の良いモバイルプレゼンテーション" [level=3] [ref=f5e142]
            - paragraph [ref=f5e143]: 柔らかい色、キャンディーショップの背景、タッチフレンドリーな UI により、このゲームは iOS および Android の短いセッションでも読みやすくなっています。
      - generic [ref=f5e144]:
        - generic [ref=f5e145]: ゲームプレイループ
        - heading "ドロップを選択し、コンテナを制御し、マージ チェーンを維持します。" [level=2] [ref=f5e146]
        - list [ref=f5e147]:
          - listitem [ref=f5e148]:
            - generic [ref=f5e149]: ステップ01
            - strong [ref=f5e150]: 次のキャンディーを読む
            - paragraph [ref=f5e151]: プレイヤーは次のお菓子、現在のスタック、コンテナ内の利用可能なスペースを確認します。
          - listitem [ref=f5e152]:
            - generic [ref=f5e153]: ステップ02
            - strong [ref=f5e154]: 意図を持って配置する
            - paragraph [ref=f5e155]: ドロップは、クリーンなマージを設定したり、将来の動きをブロックしたり、次の決定を変えるプレッシャーを生み出したりする可能性があります。
          - listitem [ref=f5e156]:
            - generic [ref=f5e157]: ステップ03
            - strong [ref=f5e158]: 合体とコンボ
            - paragraph [ref=f5e159]: マッチするキャンディーはより大きなおやつに進化し、連鎖反応によって賢く配置されます。
          - listitem [ref=f5e160]:
            - generic [ref=f5e161]: ステップ04
            - strong [ref=f5e162]: 進歩と繰り返し
            - paragraph [ref=f5e163]: プレイヤーは、より高いキャンディーステージ、より良いラン、よりクリーンなコンボ、そして将来の進行報酬を追い求めます。
      - generic [ref=f5e164]:
        - generic [ref=f5e165]: ストーリー・世界観
        - heading "あらゆるお菓子が大きなものになる、陽気なお菓子屋さん。" [level=2] [ref=f5e166]
        - generic [ref=f5e167]:
          - generic [ref=f5e168]:
            - paragraph [ref=f5e169]: Candy Shop は、WillowinWorlds の 2 番目のゲーム アイデアとして 2025 年に始まりました。それは、シンプルな喜びと満足のいく物理学を中心に構築された、明るく居心地の良いキャンディー マージ パズルです。
            - paragraph [ref=f5e170]: 世界は意図的に温かく、読みやすいものになっています。棚、お菓子、柔らかいマスコット、お店のような容器は、どんな小さなお菓子にも大きなお菓子になる道があるという幻想を裏付けています。
            - paragraph [ref=f5e171]: 最初のプロトタイプの後、チームは GDD を拡張し、方向性を再構築し、13 個のキャンディーのマージ チェーンを完成させ、10 個のコンテナ ルールセット、特別なレシピ、計画ツール、最初のメタ進行システムを実装しました。
