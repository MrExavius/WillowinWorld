      - generic [ref=f5e384]:
        - generic [ref=f5e385]: Candy Shop FAQ
        - heading "プレーヤー、プレス、出版パートナー向けの回答。" [level=2] [ref=f5e386]
        - generic [ref=f5e387]:
          - article [ref=f5e388]:
            - heading "Candy Shop はどんなゲームですか？" [level=3] [ref=f5e389]
            - paragraph [ref=f5e390]: 柔らかな物理挙動のドロップ、スペシャルスイーツ、コンボ、進行要素を楽しめる、心地よいキャンディマージパズル。
          - article [ref=f5e391]:
            - heading "ゲームプレイはどのように機能しますか?" [level=3] [ref=f5e392]
            - paragraph [ref=f5e393]: キャンディを選んで容器に落とし、同じお菓子を合体させ、空間を管理しながら、より大きなキャンディへの進化を目指します。
          - article [ref=f5e394]:
            - heading "何が違うのですか？" [level=3] [ref=f5e395]
            - paragraph [ref=f5e396]: 親しみやすいマージパズルのループに、心地よいキャンディの世界観、スペシャルスイーツ、分かりやすいコンボ、容器内の空間管理を組み合わせています。
          - article [ref=f5e397]:
            - heading "現在の状況はどうですか？" [level=3] [ref=f5e398]
            - paragraph [ref=f5e399]: 現在開発中。現行プロジェクトには、マージチェーン、10種類の容器ルール、スペシャルレシピ、デイリーチャレンジ、Candy Book、ローカルスコアランキングが実装されています。
          - article [ref=f5e400]:
            - heading "公開素材は使用できますか？" [level=3] [ref=f5e401]
            - paragraph [ref=f5e402]: はい、プレス、出版社のレビュー、ストアの参照用です。ソース資産は、直接要求されない限り非公開のままです。
      - generic [ref=f5e403]:
        - generic [ref=f5e404]: Candy Shop Devlog
        - heading "いつ何が変わったのか" [level=2] [ref=f5e405]
        - list [ref=f5e406]:
          - listitem [ref=f5e407]:
            - time [ref=f5e408]: 2026 年 7 月 31 日
            - strong [ref=f5e409]: 制作メニューとHUDパス
            - paragraph [ref=f5e410]: メイン メニュー、レベル選択、HUD コントロール、およびコマンド アイコンが 1 つの視覚言語を共有するようになりました。追加のエンジン内ストレス テストでは、更新されたフローがカバーされます。
          - listitem [ref=f5e411]:
            - generic [ref=f5e412]: 2026 年 7 月
            - strong [ref=f5e413]: より充実した製品版ビルド
            - paragraph [ref=f5e414]: 現行プロジェクトでは、完全なマージチェーンに、10種類の容器ルール、スペシャルレシピ、計画ツール、デイリーチャレンジ、Candy Book の発見要素、ローカルスコアランキングを組み合わせています。
          - listitem [ref=f5e415]:
            - generic [ref=f5e416]: 2026 年 4 月
            - strong [ref=f5e417]: UI elements pass
            - paragraph [ref=f5e418]: 主要なUI要素を初めて制作し、Candy Shop らしいモバイル向けの個性と、より魅力的なカジュアル表現を確立しました。
          - listitem [ref=f5e419]:
            - generic [ref=f5e420]: 2026 年 2 月
            - strong [ref=f5e421]: キャンディチェーンと容器
            - paragraph [ref=f5e422]: キャンディの全セットが完成し、容器システムによって形状、重力、パズルの緊張感が変化するようになりました。
          - listitem [ref=f5e423]:
            - generic [ref=f5e424]: 2025 年 12 月
            - strong [ref=f5e425]: キャンディの基本メカニクス
            - paragraph [ref=f5e426]: 主要なキャンディメカニクスをラフ実装し、拡張したGDDを実際に遊べるシステムへ落とし込みました。
          - listitem [ref=f5e427]:
            - generic [ref=f5e428]: 2025 年 10 月
            - strong [ref=f5e429]: GDD拡張
            - paragraph [ref=f5e430]: 最初のプロトタイプでは魅力が十分でないと判断し、スペシャルスイーツや進行要素のアイデアを加えてゲームデザインを拡張しました。
          - listitem [ref=f5e431]:
