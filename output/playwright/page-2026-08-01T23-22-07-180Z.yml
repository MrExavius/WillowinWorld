            - generic [ref=f5e336]: 2025年6月下旬
            - strong [ref=f5e337]: 2番目のゲームアイデア
            - paragraph [ref=f5e338]: WillowinWorlds は、シンプルで楽しく、幅広い人に親しまれる遊びを軸に、明るいキャンディゲームの企画を模索し始めました。
