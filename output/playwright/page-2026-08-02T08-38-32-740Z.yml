      - generic [ref=f6e210]:
        - generic [ref=f6e211]:
          - heading "ワンアクション。一つの生きた世界。" [level=2] [ref=f6e213]
          - paragraph [ref=f6e214]: 各ゲームはワンタッチ ルール (ドロー、ドロップ、ミックス、またはドッジ) で始まり、その後、キャラクター、明確なフィードバック、およびプレイヤーがマニュアルなしで読むことができる結果が追加されます。
        - generic [ref=f6e215]:
          - article [ref=f6e216]:
            - heading "遊び心のあるインタラクション" [level=3] [ref=f6e220]
            - paragraph [ref=f6e221]: タップ、ライン、ドロップ、ショットのたびに視覚的な反応が即座に得られるため、原因と結果が明確になります。
          - article [ref=f6e222]:
            - heading "読みやすいデザイン" [level=3] [ref=f6e226]
            - paragraph [ref=f6e227]: 動き、コントラスト、ペースは、説明文が必要になる前に目標と結果を示します。
          - article [ref=f6e228]:
            - heading "キャラクターアイデンティティ" [level=3] [ref=f6e232]
            - paragraph [ref=f6e233]: マスコットやオブジェクト、UIには装飾以前に個性があります。
          - article [ref=f6e234]:
            - heading "モバイルファーストのUX" [level=3] [ref=f6e238]
            - paragraph [ref=f6e239]: コントロール、リズム、レイアウトは、小さな画面でも親指、短いセッション、読みやすい UI、明確な意思決定を考慮して構築されています。
          - article [ref=f6e240]:
            - heading "満足のいくフィードバック" [level=3] [ref=f6e244]
            - paragraph [ref=f6e245]: インパクト、マージ、スプラッシュ、勝利、失敗の瞬間が鮮明に感じられるまで調整されています。
          - article [ref=f6e246]:
            - heading "居心地の良い奥行き" [level=3] [ref=f6e250]
            - paragraph [ref=f6e251]: ソフトなプレゼンテーションにより、計画、習得、再現の余地が残ります。
      - generic [ref=f6e253]:
        - article [ref=f6e254]:
          - heading "触覚モバイル世界のための小さなスタジオ。" [level=2] [ref=f6e255]
          - paragraph [ref=f6e256]: "WillowinWorlds は、4 つのモバイルファーストのパズルおよびアーケード ゲームを開発しています: Nature Seed、Candy Shop、Paint Blasters、および Ball is God?! 各プロジェクトには、公開ゲーム ページ、現在のビルド ステータス、日付の付いた開発ブログおよびプレス アセットがあります。"
          - generic [ref=f6e257]:
            - generic [ref=f6e258]: モバイルファーストの感触
            - generic [ref=f6e259]: 居心地の良いファンタジーの世界
            - generic [ref=f6e260]: インタラクティブシステム
            - generic [ref=f6e261]: 独特の 2D アート
          - paragraph [ref=f6e262]: 現在の作業は、描画から解決までのライン物理学、10 個のコンテナにわたるキャンディーの結合、35 個のカラー発射体レシピ、および 10 か所にわたる回転塔降下に及びます。
        - article [ref=f6e263]:
          - img "WillowinWorlds ロゴと魔法の猫、ツイン W マーク、城の世界" [ref=f6e265]
          - generic [ref=f6e266]:
            - heading "4試合。 4 つの異なるプレイ可能なシステム。" [level=3] [ref=f6e267]
            - paragraph [ref=f6e268]: 限られた物理的なパスを描画し、変化するキャンディーの容器を管理し、カラーショットを組み立て、下降するタワーを回転させます。各ゲームのページを開いて、現在の範囲、制作ステータス、最新の日付の更新を確認してください。
      - generic [ref=f6e270]:
        - heading "最初のサビから 洗練されたモバイルリリースへ。" [level=2] [ref=f6e273]
        - generic [ref=f6e274]:
          - article [ref=f6e275]:
            - text: "01"
            - heading "アイデア" [level=3] [ref=f6e276]
            - paragraph [ref=f6e277]: ファンタジー、明確なジャンル、プレイヤーの約束、核となる触覚ループを定義します。
          - article [ref=f6e278]:
            - text: "02"
            - heading "プロトタイプ" [level=3] [ref=f6e279]
            - paragraph [ref=f6e280]: 実際の入力、フィードバック、失敗状態を使用して、最短のプレイアブルプルーフを構築します。
          - article [ref=f6e281]:
            - text: "03"
            - heading "感触テスト" [level=3] [ref=f6e282]
            - paragraph [ref=f6e283]: コントロール、フリクション、ペーシング、読みやすさ、繰り返した後もループが良好に感じられるかどうかを調整します。
          - article [ref=f6e284]:
            - text: "04"
            - heading "アートディレクション" [level=3] [ref=f6e285]
            - paragraph [ref=f6e286]: 形状のシルエット、パレット、UI 言語、アイコンの読みやすさ、キャラクターのアイデンティティ。
          - article [ref=f6e287]:
            - text: "05"
            - heading "制作" [level=3] [ref=f6e288]
            - paragraph [ref=f6e289]: コンテンツ、システム、進行、最適化、技術的基盤をスケールします。
          - article [ref=f6e290]:
            - text: "06"
            - heading "仕上げ" [level=3] [ref=f6e291]
            - paragraph [ref=f6e292]: トランジション、VFX、オーディオビート、オンボーディング、アクセシビリティ、ユーザーの快適さを洗練させます。
          - article [ref=f6e293]:
            - text: "07"
            - heading "起動" [level=3] [ref=f6e294]
            - paragraph [ref=f6e295]: ストアアセット、報道資料、分析、ライブアップデート、コミュニティループを準備します。
          - article [ref=f6e296]:
            - text: "08"
            - heading "継続運用" [level=3] [ref=f6e297]
            - paragraph [ref=f6e298]: リリースを測定し、プレイヤーの声に耳を傾け、集中的なアップデートで各世界を健全に保ちます。
