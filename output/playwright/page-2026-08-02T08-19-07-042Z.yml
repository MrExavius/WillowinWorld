        - generic [ref=f2e265]:
          - article [ref=f2e266]:
            - heading "Небольшая студия живых мобильных миров." [level=2] [ref=f2e267]
            - paragraph [ref=f2e268]: "WillowinWorlds разрабатывает четыре мобильные головоломки и аркадные игры: Nature Seed, Candy Shop, Paint Blasters и Ball is God?!. Каждый проект имеет общедоступную страницу игры, текущий статус сборки, датированный журнал разработки и материалы для прессы."
            - generic [ref=f2e269]:
              - generic [ref=f2e270]: Мобильный подход
              - generic [ref=f2e271]: Уютные фэнтезийные миры
              - generic [ref=f2e272]: Интерактивные системы
              - generic [ref=f2e273]: Отличительная 2D-графика
            - paragraph [ref=f2e274]: Текущая работа включает в себя физику рисования линий, объединение конфет в десяти контейнерах, 35 рецептов цветных снарядов и спуск с помощью вращающейся башни в десяти локациях.
          - article [ref=f2e275]:
            - img "Логотип WillowinWorlds с волшебным котом, двойным знаком W и миром замков." [ref=f2e277]
            - generic [ref=f2e278]:
              - heading "Четыре игры. Четыре различные игровые системы." [level=3] [ref=f2e279]
              - paragraph [ref=f2e280]: Нарисуйте ограниченный физический путь, управляйте меняющимся контейнером для конфет, соберите цветной снимок или вращайте нисходящую башню. Откройте каждую страницу игры, чтобы узнать ее текущий объем, статус производства и последнее датированное обновление.
