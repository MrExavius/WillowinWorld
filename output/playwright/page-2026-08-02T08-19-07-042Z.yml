        - generic [ref=f2e221]:
          - generic [ref=f2e222]:
            - heading "Одно действие. Целый живой мир." [level=2] [ref=f2e224]
            - paragraph [ref=f2e225]: Каждая игра начинается с одного жеста — нарисовать, бросить, смешать или уклониться, — а затем раскрывается через характер, ясную обратную связь и понятные без инструкции последствия.
          - generic [ref=f2e226]:
            - article [ref=f2e227]:
              - heading "Живое взаимодействие" [level=3] [ref=f2e231]
              - paragraph [ref=f2e232]: Каждое касание, линия, падение и выстрел вызывает немедленный визуальный отклик, поэтому причина и следствие остаются ясными.
            - article [ref=f2e233]:
              - heading "Читабельный дизайн" [level=3] [ref=f2e237]
              - paragraph [ref=f2e238]: Движение, контраст и темп показывают цель и последствия до того, как потребуется пояснительный текст.
            - article [ref=f2e239]:
              - heading "Личность персонажа" [level=3] [ref=f2e243]
              - paragraph [ref=f2e244]: Талисманы, объекты и пользовательский интерфейс приобретают индивидуальность еще до того, как приобретают украшения.
            - article [ref=f2e245]:
              - heading "Мобильный UX с первого дня" [level=3] [ref=f2e249]
              - paragraph [ref=f2e250]: Элементы управления, ритм и макет созданы для больших пальцев, коротких сеансов, читаемого пользовательского интерфейса и четких решений на маленьких экранах.
            - article [ref=f2e251]:
              - heading "Выразительная обратная связь" [level=3] [ref=f2e255]
              - paragraph [ref=f2e256]: Моменты удара, слияния, всплеска, победы и неудачи настраиваются до тех пор, пока они не станут четкими.
            - article [ref=f2e257]:
              - heading "Уют с глубиной" [level=3] [ref=f2e261]
              - paragraph [ref=f2e262]: Мягкая презентация оставляет место для планирования, освоения и повторения.
        - button [ref=f2e263] [cursor=pointer]: S
