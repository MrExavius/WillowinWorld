name: Site Quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * 1"

permissions:
  contents: read

jobs:
  static-site-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          for file in site/*.js site/tools/*.mjs; do
            node --check "$file"
          done

      - name: Run full quality check
        run: node site/tools/quality-check.mjs

      - name: Run CSS coverage audit (informational)
        continue-on-error: true
        run: node site/tools/css-coverage-audit.mjs

      - name: Build minified static output
        run: node site/tools/build-minified.mjs
