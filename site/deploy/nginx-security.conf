# Include this inside the HTTPS server block that serves WillowinWorld.
# Keep HTTP on a separate server block that redirects to HTTPS.

add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; child-src 'none'; connect-src 'none'; form-action 'none'; img-src 'self' data:; style-src 'self'; script-src 'self' 'sha256-YEmRj4MUCAFjWbGin8kF7Sx3sRy60JEX+N5xb8TIze4='; font-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'self'; trusted-types 'none'; require-trusted-types-for 'script'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Origin-Agent-Cluster "?1" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

autoindex off;

location = / {
    expires -1;
}

location ~* \.html$ {
    expires -1;
}

location ^~ /assets/ {
    expires 1y;
}

location = /manifest.webmanifest {
    expires 1h;
}

location = /sitemap.xml {
    expires 1h;
}

location = /robots.txt {
    expires 1h;
}

types {
    text/html html;
    text/css css;
    application/javascript js;
    application/manifest+json webmanifest;
    application/xml xml;
    text/plain txt;
    image/svg+xml svg;
    image/webp webp;
    image/png png;
}
